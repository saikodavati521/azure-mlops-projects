trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: mlops-steel-energy-vg
  - name: SERVICE_CONNECTION
    value: AzureML-ServiceConnection

stages:
  - stage: CI
    jobs:
      - job: Tests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pytest
              python -m compileall .
            displayName: Test and compile

  - stage: Infrastructure
    dependsOn: CI
    jobs:
      - job: AzureResources
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                az extension add -n ml -y || az extension update -n ml
                az group create -n "$(RESOURCE_GROUP)" -l "$(LOCATION)"
                az ml workspace show -g "$(RESOURCE_GROUP)" -n "$(WORKSPACE_NAME)" || \
                  az ml workspace create -g "$(RESOURCE_GROUP)" -n "$(WORKSPACE_NAME)" -l "$(LOCATION)"
                az ml compute show -g "$(RESOURCE_GROUP)" -w "$(WORKSPACE_NAME)" -n "$(COMPUTE_NAME)" || \
                  az ml compute create -g "$(RESOURCE_GROUP)" -w "$(WORKSPACE_NAME)" -n "$(COMPUTE_NAME)" --type amlcompute --min-instances 0 --max-instances 2

  - stage: Data
    dependsOn: Infrastructure
    jobs:
      - job: DataValidation
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
          - script: pip install -r requirements.txt
            displayName: Install dependencies
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                if [ -f data/Steel_industry_data.csv ]; then
                  python data_migration/migrate.py --csv-path data/Steel_industry_data.csv
                else
                  echo "Dataset not present in repo; register it from a secure pipeline artifact or storage location."
                fi

  - stage: Training
    dependsOn: Data
    jobs:
      - job: SubmitTraining
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
          - script: pip install -r requirements.txt
          - task: AzureCLI@2
            name: train
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                python create_env/custom_env.py
                JOB_NAME=$(python model_training/command_job.py | awk '/Submitted training job:/ {print $4}')
                az ml job stream -g "$(RESOURCE_GROUP)" -w "$(WORKSPACE_NAME)" -n "$JOB_NAME"
                STATUS=$(az ml job show -g "$(RESOURCE_GROUP)" -w "$(WORKSPACE_NAME)" -n "$JOB_NAME" --query status -o tsv)
                test "$STATUS" = "Completed"
                echo "##vso[task.setvariable variable=JOB_NAME;isOutput=true]$JOB_NAME"

  - stage: Evaluation
    dependsOn: Training
    jobs:
      - job: QualityGate
        variables:
          JOB_NAME: $[ stageDependencies.Training.SubmitTraining.outputs['train.JOB_NAME'] ]
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
          - script: pip install -r requirements.txt
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                az ml job download -g "$(RESOURCE_GROUP)" -w "$(WORKSPACE_NAME)" -n "$(JOB_NAME)" --download-path job_artifacts
                python responsible_ai_gate/responsible.py --metrics-path job_artifacts/named-outputs/output_dir/metrics.json

  - stage: Registration
    dependsOn: Evaluation
    jobs:
      - job: Register
        variables:
          JOB_NAME: $[ stageDependencies.Training.SubmitTraining.outputs['train.JOB_NAME'] ]
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
          - script: pip install -r requirements.txt
          - task: AzureCLI@2
            name: register
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                python register_model/register.py --run-id "$(JOB_NAME)" --version "$(Build.BuildId)"
                echo "##vso[task.setvariable variable=MODEL_VERSION;isOutput=true]$(Build.BuildId)"

  - stage: Deployment
    dependsOn: Registration
    jobs:
      - job: DeployBlue
        variables:
          MODEL_VERSION: $[ stageDependencies.Registration.Register.outputs['register.MODEL_VERSION'] ]
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
          - script: pip install -r requirements.txt
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                python model_deployment/endpoint_creation/endpoint.py
                python model_deployment/deployment.py --model-version "$(MODEL_VERSION)"

  - stage: SmokeTest
    dependsOn: Deployment
    jobs:
      - job: Invoke
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
          - script: pip install -r requirements.txt
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export AZURE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                python invoke_model/predict.py --request-file invoke_model/sample.json

  - stage: Monitoring
    dependsOn: SmokeTest
    jobs:
      - job: MonitoringHooks
        steps:
          - script: |
              echo "Monitor input drift, prediction drift, delayed labels, MAE, RMSE, and R2."
              echo "Drift or degradation should trigger retraining through the candidate evaluation gate."
            displayName: Monitoring architecture hook
